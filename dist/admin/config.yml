backend:
  name: github
  repo: imagonbar/acopercyl-web
  branch: main
  base_url: https://www.acopercyl.org
  auth_endpoint: api/auth

# Configuración para modo local
local_backend:
  url: http://localhost:8081/api/v1

media_folder: "public/assets/img"
public_folder: "/assets/img"

collections:
  - name: "web_content"
    label: "🖥️ Contenido de la Web"
    delete: false
    files:
      - name: "datos"
        label: "Gestión General de la Web"
        file: "public/content/site_data.json"
        fields:
          - label: "Listado de Noticias"
            name: "news"
            widget: "list"
            collapsed: true
            summary: '{{title}} ({{date}})'
            fields:
              - {label: "Título", name: "title", widget: "string", required: false}
              - {label: "Medio de Comunicación", name: "source", widget: "string", hint: "Ej: El Norte de Castilla, RNE, etc.", required: false}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Imagen", name: "image", widget: "image", required: false}
              - {label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", required: false}

          - label: "Comunicados Oficiales"
            name: "comunicados"
            widget: "list"
            collapsed: true
            summary: '{{title}} ({{date}})'
            fields:
              - {label: "Título del Comunicado", name: "title", widget: "string"}
              - {label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
              - {label: "Archivo PDF", name: "file", widget: "file"}

          - label: "Preguntas Frecuentes (FAQ)"
            name: "faq"
            widget: "list"
            collapsed: true
            summary: '{{question}}'
            fields:
              - {label: "Pregunta", name: "question", widget: "string"}
              - {label: "Respuesta", name: "answer", widget: "text"}

          - label: "Cabecera (Hero)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Texto", name: "text", widget: "text"}

          - label: "Sobre Nosotros"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Nuestra Misión", name: "mission", widget: "text"}
              - {label: "Nuestra Visión", name: "vision", widget: "text"}
              - {label: "Nuestra Lucha", name: "struggle", widget: "text"}

          - label: "Nuestros Objetivos"
            name: "objectives"
            widget: "list"
            collapsed: true
            summary: '{{title}}'
            fields:
              - {label: "Icono / Emoji", name: "icon", widget: "string", hint: "Ej: ⚖️, 🔬, 📢"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Texto descriptivo", name: "text", widget: "text"}

          - label: "Síntomas Frecuentes"
            name: "symptoms"
            widget: "list"
            collapsed: true
            summary: '{{title}}'
            fields:
              - {label: "Icono / Emoji", name: "icon", widget: "string", hint: "Ej: 🔋, 🧠, 🫁"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Texto descriptivo", name: "text", widget: "text"}

          - label: "Redes Sociales"
            name: "social"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Instagram", name: "instagram", widget: "string"}
              - {label: "X", name: "x", widget: "string"}
              - {label: "Facebook", name: "facebook", widget: "string"}

          - label: "Comunidad"
            name: "community"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Texto de invitación", name: "text", widget: "text"}

          - label: "Contacto"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Teléfono", name: "phone", widget: "string", required: false}
              - {label: "Ubicación", name: "location", widget: "string"}

          - label: "Política de Privacidad"
            name: "privacy"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Contenido de Privacidad (Markdown)", name: "content", widget: "text"}
